[/Script/EnhancedInput.EnhancedInputProjectSettings]
DefaultMappingContexts=(MappingContext="/Game/Input/IMC_Default",Priority=0)

[/Script/Engine.InputSettings]
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; ---- On-Foot Movement ----
+ActionMappings=(ActionName="MoveForward",Key=W)
+ActionMappings=(ActionName="MoveForward",Key=Up)
+ActionMappings=(ActionName="MoveBack",Key=S)
+ActionMappings=(ActionName="MoveBack",Key=Down)
+ActionMappings=(ActionName="MoveLeft",Key=A)
+ActionMappings=(ActionName="MoveRight",Key=D)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="ToggleInventory",Key=I)
+ActionMappings=(ActionName="ToggleMap",Key=M)
+ActionMappings=(ActionName="TogglePause",Key=Escape)
+ActionMappings=(ActionName="PhotoMode",Key=F12)

; ---- Look ----
+AxisMappings=(AxisName="LookHorizontal",Key=MouseX,Scale=1.0)
+AxisMappings=(AxisName="LookVertical",Key=MouseY,Scale=-1.0)

; ---- Ship Flight ----
+ActionMappings=(ActionName="ShipThrust",Key=W)
+ActionMappings=(ActionName="ShipBrake",Key=S)
+ActionMappings=(ActionName="ShipRollLeft",Key=Q)
+ActionMappings=(ActionName="ShipRollRight",Key=E)
+ActionMappings=(ActionName="ShipBoost",Key=LeftShift)
+ActionMappings=(ActionName="ToggleLandingGear",Key=G)
+ActionMappings=(ActionName="AssistedLanding",Key=L)
+ActionMappings=(ActionName="OpenNavComputer",Key=N)
+ActionMappings=(ActionName="ExitShip",Key=F)

; ---- Gamepad ----
+AxisMappings=(AxisName="LookHorizontal",Key=Gamepad_RightX,Scale=1.0)
+AxisMappings=(AxisName="LookVertical",Key=Gamepad_RightY,Scale=-1.0)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="Sprint",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="ToggleInventory",Key=Gamepad_FaceButton_Top)
